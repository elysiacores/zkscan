{{define "content"}}{{with .Data}}
<section class="card narrow">
  <h1>เปลี่ยนรหัสผ่าน</h1>
  {{if $.MustChange}}<div class="flash flash-warn">นี่เป็นการเข้าครั้งแรก (หรือรหัสถูกรีเซ็ต) กรุณาตั้งรหัสผ่านใหม่ก่อนใช้งานต่อ</div>{{end}}
  {{if .Err}}<div class="flash flash-err" role="alert">{{.Err}}</div>{{end}}
  <form method="post" action="/change-password" class="form">
    <label class="field"><span>รหัสผ่านเดิม</span>
      <input name="old_password" type="password" autocomplete="current-password" required></label>
    <label class="field"><span>รหัสผ่านใหม่</span>
      <input name="new_password" type="password" autocomplete="new-password" minlength="8" required></label>
    <label class="field"><span>ยืนยันรหัสผ่านใหม่</span>
      <input name="confirm_password" type="password" autocomplete="new-password" minlength="8" required></label>
    <ul class="rules small muted">
      <li>ยาวอย่างน้อย 8 ตัวอักษร</li>
      <li>ต้องไม่เหมือนชื่อผู้ใช้</li>
      <li>ต้องไม่เหมือนรหัสผ่านเดิม</li>
    </ul>
    <button class="btn btn-primary" type="submit">บันทึกรหัสผ่านใหม่</button>
  </form>
</section>
{{end}}{{end}}
